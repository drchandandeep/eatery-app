<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kahumbo -- Platform Admin</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #14110f; color: #f5efe9;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 26px; margin: 24px 0 4px; }
  p.muted { color: #a89c92; margin: 0 0 24px; }
  .card {
    background: #1e1a17; border: 1px solid #322c27; border-radius: 14px;
    padding: 20px; margin-bottom: 16px;
  }
  input, textarea, select {
    width: 100%; background: #14110f; border: 1px solid #322c27; color: #f5efe9;
    border-radius: 10px; padding: 12px 14px; font-size: 15px; margin-top: 6px;
  }
  label { font-size: 13px; color: #a89c92; }
  button {
    background: #e8763a; color: #fff; border: none; border-radius: 10px;
    padding: 12px 18px; font-size: 15px; font-weight: 700; cursor: pointer;
    margin-top: 14px; width: 100%;
  }
  button.secondary { background: transparent; border: 1px solid #e05555; color: #e05555; }
  button:disabled { opacity: 0.5; cursor: default; }
  .row { display: flex; gap: 10px; }
  .row > button { flex: 1; margin-top: 14px; }
  img.shot { width: 100%; border-radius: 10px; margin-top: 12px; background: #14110f; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .error { color: #e05555; font-size: 14px; margin-top: 10px; }
  .success { color: #4caf6d; font-size: 14px; margin-top: 10px; }
  #logoutBtn { background: transparent; border: 1px solid #322c27; color: #a89c92; width: auto; padding: 8px 16px; font-size: 13px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; }
  .empty { color: #a89c92; text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const API = window.location.origin + '/api';
let token = localStorage.getItem('kahumbo_platform_token') || null;

function el(html) {
  const d = document.createElement('div');
  d.innerHTML = html.trim();
  return d.firstChild;
}

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { Authorization: 'Bearer ' + token } : {}),
      ...(opts.headers || {}),
    },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function renderLogin(errorMsg) {
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(el(`
    <div>
      <h1>Kahumbo Admin</h1>
      <p class="muted">Sign in with your platform admin account to review subscription payments.</p>
      <div class="card">
        <label>Email</label>
        <input id="email" type="email" placeholder="you@example.com" value="gkgst2026@gmail.com" />
        <label style="margin-top:12px;display:block">Password</label>
        <input id="password" type="password" placeholder="••••••••" value="Simi@1287" />
        ${errorMsg ? `<div class="error">${errorMsg}</div>` : ''}
        <button id="loginBtn">Log in</button>
      </div>
    </div>
  `));
  document.getElementById('loginBtn').onclick = async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    try {
      const { token: t, user } = await api('/auth/login', { method: 'POST', body: { identifier: email, password } });
      if (user.role !== 'platform_admin') throw new Error('This account is not a platform admin.');
      token = t;
      localStorage.setItem('kahumbo_platform_token', t);
      renderDashboard();
    } catch (err) {
      renderLogin(err.message);
    }
  };
}

async function renderDashboard() {
  const app = document.getElementById('app');
  app.innerHTML = '<p class="muted">Loading…</p>';

  let requests;
  try {
    ({ requests } = await api('/platform/subscription-requests?status=pending'));
  } catch (err) {
    token = null;
    localStorage.removeItem('kahumbo_platform_token');
    return renderLogin('Session expired -- please log in again.');
  }

  app.innerHTML = '';
  app.appendChild(el(`
    <div class="topbar">
      <div>
        <h1>Approvals</h1>
        <p class="muted">Subscription payment proofs awaiting review</p>
      </div>
      <button id="logoutBtn">Log out</button>
    </div>
  `));
  document.getElementById('logoutBtn').onclick = () => {
    token = null;
    localStorage.removeItem('kahumbo_platform_token');
    renderLogin();
  };

  // Reports -- platform-wide totals, plus a dropdown to drill into one
  // store's own order count and revenue.
  let reportsData = null;
  try {
    reportsData = await api('/platform/reports');
  } catch (err) {
    reportsData = null;
  }
  if (reportsData) {
    const { totals, stores } = reportsData;
    const reportsCard = el(`
      <div class="card">
        <div style="font-weight:700;font-size:17px">Reports</div>
        <div class="row" style="margin-top:12px">
          <div style="flex:1;text-align:center;background:#14110f;border:1px solid #322c27;border-radius:10px;padding:10px">
            <div style="font-weight:800;font-size:18px;color:#e8763a">${totals.total_stores}</div>
            <div class="muted" style="font-size:12px">Stores</div>
          </div>
          <div style="flex:1;text-align:center;background:#14110f;border:1px solid #322c27;border-radius:10px;padding:10px">
            <div style="font-weight:800;font-size:18px;color:#e8763a">${totals.total_orders}</div>
            <div class="muted" style="font-size:12px">Orders</div>
          </div>
          <div style="flex:1;text-align:center;background:#14110f;border:1px solid #322c27;border-radius:10px;padding:10px">
            <div style="font-weight:800;font-size:18px;color:#e8763a">\u20b9${Math.round(totals.total_revenue).toLocaleString('en-IN')}</div>
            <div class="muted" style="font-size:12px">Revenue</div>
          </div>
        </div>
        <label style="margin-top:16px;display:block">View a specific store</label>
        <select id="storeSelect">
          <option value="">All stores (totals above)</option>
          ${stores.map((s) => `<option value="${s.id}">${s.name}</option>`).join('')}
        </select>
        <div id="storeDetail" style="margin-top:12px"></div>
      </div>
    `);
    reportsCard.querySelector('#storeSelect').onchange = async (e) => {
      const detail = reportsCard.querySelector('#storeDetail');
      const storeId = e.target.value;
      if (!storeId) { detail.innerHTML = ''; return; }
      detail.innerHTML = '<p class="muted">Loading…</p>';
      try {
        const r = await api(`/platform/reports/${storeId}`);
        detail.innerHTML = `
          <div class="muted" style="font-size:13px">Subscription: ${r.store.subscription_status} \u00b7 \u20b9${Math.round(r.store.annual_fee)}/year</div>
          <div class="row" style="margin-top:8px">
            <div style="flex:1;text-align:center;background:#14110f;border:1px solid #322c27;border-radius:10px;padding:10px">
              <div style="font-weight:800;font-size:18px;color:#e8763a">${r.order_count}</div>
              <div class="muted" style="font-size:12px">Orders</div>
            </div>
            <div style="flex:1;text-align:center;background:#14110f;border:1px solid #322c27;border-radius:10px;padding:10px">
              <div style="font-weight:800;font-size:18px;color:#e8763a">\u20b9${Math.round(r.revenue).toLocaleString('en-IN')}</div>
              <div class="muted" style="font-size:12px">Revenue</div>
            </div>
          </div>
        `;
      } catch (err) {
        detail.innerHTML = `<div class="error">${err.message}</div>`;
      }
    };
    app.appendChild(reportsCard);
  }

  if (requests.length === 0) {
    app.appendChild(el('<div class="empty">Nothing pending review right now.</div>'));
  }

  for (const r of requests) {
    const card = el(`
      <div class="card">
        <div style="font-weight:700;font-size:17px">${r.store_name}</div>
        <div class="muted" style="font-size:13px">${r.owner_email}</div>
        <div style="margin-top:6px">₹${Math.round(r.amount)}</div>
        ${r.note ? `<div class="muted" style="margin-top:4px">Note: ${r.note}</div>` : ''}
        <img class="shot" src="${r.screenshot_base64}" />
        <div class="muted" style="font-size:12px;margin-top:8px">Submitted ${new Date(r.created_at).toDateString()}</div>
        <div class="row">
          <button data-approve="${r.id}">Approve</button>
          <button class="secondary" data-reject="${r.id}">Reject</button>
        </div>
        <div class="msg"></div>
      </div>
    `);
    card.querySelector('[data-approve]').onclick = async (e) => {
      e.target.disabled = true;
      try {
        const { message } = await api(`/platform/subscription-requests/${r.id}/approve`, { method: 'POST' });
        card.querySelector('.msg').innerHTML = `<div class="success">${message}</div>`;
        setTimeout(renderDashboard, 900);
      } catch (err) {
        card.querySelector('.msg').innerHTML = `<div class="error">${err.message}</div>`;
        e.target.disabled = false;
      }
    };
    card.querySelector('[data-reject]').onclick = async (e) => {
      e.target.disabled = true;
      try {
        await api(`/platform/subscription-requests/${r.id}/reject`, { method: 'POST' });
        card.querySelector('.msg').innerHTML = `<div class="success">Rejected.</div>`;
        setTimeout(renderDashboard, 900);
      } catch (err) {
        card.querySelector('.msg').innerHTML = `<div class="error">${err.message}</div>`;
        e.target.disabled = false;
      }
    };
    app.appendChild(card);
  }

  // QR code management -- upload/replace the platform's payment QR shown
  // to every store owner on their subscription payment screen. Fetches the
  // current one first (if any) so this reads as "here's your QR, change it
  // below" rather than always looking like a blank first-time upload.
  let currentQr = null;
  try {
    currentQr = await api('/platform/qr-code');
  } catch (err) {
    currentQr = { image_base64: null, upi_id: null };
  }
  const hasQr = !!currentQr.image_base64;
  const qrCard = el(`
    <div class="card">
      <div style="font-weight:700;font-size:17px">Payment QR code</div>
      <p class="muted" style="font-size:13px">This is the QR store owners scan to pay their annual fee.</p>
      ${hasQr ? `<img class="shot" src="${currentQr.image_base64}" style="max-width:220px;" />` : '<p class="muted" style="font-size:13px">No QR code uploaded yet -- store owners will see "not set up yet" until you add one.</p>'}
      ${hasQr && currentQr.upi_id ? `<div class="muted" style="font-size:13px;margin-top:6px">Current UPI ID: ${currentQr.upi_id}</div>` : ''}
      <label style="margin-top:14px;display:block">UPI ID (optional, shown as text too)</label>
      <input id="upiId" placeholder="yourname@upi" value="${currentQr.upi_id || ''}" />
      <label style="margin-top:12px;display:block">${hasQr ? 'Replace QR code image' : 'QR code image'}</label>
      <input id="qrFile" type="file" accept="image/*" />
      <button id="qrUploadBtn">${hasQr ? 'Change QR code' : 'Upload QR code'}</button>
      <div class="msg"></div>
    </div>
  `);
  qrCard.querySelector('#qrUploadBtn').onclick = async (e) => {
    const fileInput = qrCard.querySelector('#qrFile');
    const upiId = qrCard.querySelector('#upiId').value.trim();
    const file = fileInput.files[0];
    if (!file) {
      qrCard.querySelector('.msg').innerHTML = '<div class="error">Choose an image first.</div>';
      return;
    }
    e.target.disabled = true;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        await api('/platform/qr-code', { method: 'POST', body: { image_base64: reader.result, upi_id: upiId || undefined } });
        qrCard.querySelector('.msg').innerHTML = '<div class="success">QR code updated.</div>';
        setTimeout(renderDashboard, 900);
      } catch (err) {
        qrCard.querySelector('.msg').innerHTML = `<div class="error">${err.message}</div>`;
        e.target.disabled = false;
      }
    };
    reader.readAsDataURL(file);
  };
  app.appendChild(qrCard);

  // Your own login -- change email/password away from the seeded demo
  // account whenever you're ready. Requires your current password.
  const credsCard = el(`
    <div class="card">
      <div style="font-weight:700;font-size:17px">Your login</div>
      <p class="muted" style="font-size:13px">Change the email and/or password for this platform admin account.</p>
      <label>New email (leave blank to keep current)</label>
      <input id="newEmail" type="email" placeholder="you@example.com" />
      <label style="margin-top:12px;display:block">New password (leave blank to keep current)</label>
      <input id="newPassword" type="password" placeholder="At least 6 characters" />
      <label style="margin-top:12px;display:block">Current password (required)</label>
      <input id="currentPassword" type="password" placeholder="\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022" />
      <button id="credsBtn">Update login</button>
      <div class="msg"></div>
    </div>
  `);
  credsCard.querySelector('#credsBtn').onclick = async (e) => {
    const newEmail = credsCard.querySelector('#newEmail').value.trim();
    const newPassword = credsCard.querySelector('#newPassword').value;
    const currentPassword = credsCard.querySelector('#currentPassword').value;
    if (!currentPassword) {
      credsCard.querySelector('.msg').innerHTML = '<div class="error">Enter your current password to confirm.</div>';
      return;
    }
    if (!newEmail && !newPassword) {
      credsCard.querySelector('.msg').innerHTML = '<div class="error">Enter a new email and/or a new password.</div>';
      return;
    }
    e.target.disabled = true;
    try {
      const { token: newToken, message } = await api('/auth/me', {
        method: 'PATCH',
        body: { email: newEmail || undefined, password: newPassword || undefined, current_password: currentPassword },
      });
      token = newToken;
      localStorage.setItem('kahumbo_platform_token', newToken);
      credsCard.querySelector('.msg').innerHTML = `<div class="success">${message} Use your new details next time you log in.</div>`;
      credsCard.querySelector('#newEmail').value = '';
      credsCard.querySelector('#newPassword').value = '';
      credsCard.querySelector('#currentPassword').value = '';
    } catch (err) {
      credsCard.querySelector('.msg').innerHTML = `<div class="error">${err.message}</div>`;
    } finally {
      e.target.disabled = false;
    }
  };
  app.appendChild(credsCard);
}

if (token) {
  renderDashboard();
} else {
  renderLogin();
}
</script>
</body>
</html>
